name: terraform-platform

on:
  pull_request:
    paths:
      - "infra/terraform/platform/**"
      - "infra/api-gateway/**"
      - ".github/workflows/terraform-platform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/platform/**"
      - "infra/api-gateway/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Optional Terraform resource address for targeted reconcile (-target=<address>)"
        required: false
        type: string
        default: ""
      hibernate:
        description: "Set hibernate=true to scale tenant to cost floor"
        required: false
        type: boolean
        default: false
      reason:
        description: "Evidence-pack ID and approver for targeted reconcile or operator action"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-platform
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'general-ak' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'general-ak-god-view-tfstate' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/769002985772/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
  GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || 'godview-deploy-sa@general-ak.iam.gserviceaccount.com' }}
  TF_VAR_github_repository: ${{ vars.TF_VAR_github_repository || github.repository }}
  TF_VAR_iap_allowed_members: ${{ vars.TF_VAR_iap_allowed_members || '["user:admin@kambleashish.altostrat.com"]' }}
  TF_VAR_billing_account_id: ${{ secrets.TF_VAR_billing_account_id }}

jobs:
  terraform:
    name: Terraform Platform Plan & Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform/platform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=infra/terraform/platform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=platform"

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/platform validate

      - name: Record Reconcile Reason in Summary
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_HIBERNATE: ${{ inputs.hibernate }}
        run: |
          {
            echo "### Platform Targeted Reconcile / Dispatch"
            echo "- **Reason / Evidence Pack**: ${INPUT_REASON}"
            echo "- **Target**: ${INPUT_TARGET:-(full root)}"
            echo "- **Hibernate**: ${INPUT_HIBERNATE:-false}"
            echo "- **Repository**: ${TF_VAR_github_repository}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_HIBERNATE: ${{ inputs.hibernate }}
        run: |
          PLAN_ARGS=(-input=false -out=tfplan -var="hibernate=${INPUT_HIBERNATE:-false}")
          if [ -n "${INPUT_TARGET:-}" ]; then
            PLAN_ARGS+=(-target="${INPUT_TARGET}")
          fi
          terraform -chdir=infra/terraform/platform plan "${PLAN_ARGS[@]}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          terraform -chdir=infra/terraform/platform apply -input=false -auto-approve tfplan
          terraform -chdir=infra/terraform/platform output -json > infra/terraform/platform/outputs.json
