name: terraform-workloads

on:
  pull_request:
    paths:
      - "infra/terraform/workloads/**"
      - "local-env/kind/**"
      - ".github/workflows/terraform-workloads.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/workloads/**"
  workflow_run:
    workflows:
      - "terraform-platform"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: "Optional Terraform resource address for targeted reconcile (-target=<address>)"
        required: false
        type: string
        default: ""
      hibernate:
        description: "Set hibernate=true to scale GKE utilities to 0 replicas"
        required: false
        type: boolean
        default: false
      reason:
        description: "Evidence-pack ID and approver for targeted reconcile or operator action"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-workloads
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'general-ak' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'general-ak-god-view-tfstate' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/769002985772/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
  GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA || 'godview-deploy-sa@general-ak.iam.gserviceaccount.com' }}
  TF_VAR_github_repository: ${{ vars.TF_VAR_github_repository || github.repository }}

jobs:
  kind-parity:
    name: Ephemeral kind Cluster Parity Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ephemeral kind cluster (godview)
        uses: helm/kind-action@v1
        with:
          cluster_name: godview
          config: local-env/kind/cluster.yaml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Init, Validate & Plan against kind
        run: |
          terraform -chdir=infra/terraform/workloads fmt -check -recursive
          cp local-env/kind/backend_override.tf.tpl infra/terraform/workloads/backend_override.tf
          trap 'rm -f infra/terraform/workloads/backend_override.tf' EXIT
          terraform -chdir=infra/terraform/workloads init -reconfigure -input=false
          terraform -chdir=infra/terraform/workloads validate
          terraform -chdir=infra/terraform/workloads plan \
            -input=false \
            -var="provider_mode=kind" \
            -var="kube_context=kind-godview" \
            -var="service_type=NodePort"

  terraform:
    name: Terraform Workloads Plan & Apply (GKE Autopilot)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform/workloads fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=infra/terraform/workloads init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=workloads"

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/workloads validate

      - name: Record Reconcile Reason in Summary
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_HIBERNATE: ${{ inputs.hibernate }}
        run: |
          {
            echo "### Workloads Targeted Reconcile / Dispatch"
            echo "- **Reason / Evidence Pack**: ${INPUT_REASON}"
            echo "- **Target**: ${INPUT_TARGET:-(full root)}"
            echo "- **Hibernate**: ${INPUT_HIBERNATE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_HIBERNATE: ${{ inputs.hibernate }}
        run: |
          PLAN_ARGS=(-input=false -out=tfplan -var="provider_mode=gcp" -var="hibernate=${INPUT_HIBERNATE:-false}")
          if [ -n "${INPUT_TARGET:-}" ]; then
            PLAN_ARGS+=(-target="${INPUT_TARGET}")
          fi
          terraform -chdir=infra/terraform/workloads plan "${PLAN_ARGS[@]}"

      - name: Terraform Apply
        if: >-
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        run: terraform -chdir=infra/terraform/workloads apply -input=false -auto-approve tfplan
