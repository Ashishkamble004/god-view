[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-sovereign"
version = "4.0.0"
description = "God-View v4 Sovereign runtime (Perception, Sentinel Engine, Nervous System, Court Manager, Trust Ladder, Control API)"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.uv.sources]
godview-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["../.."]

[tool.hatch.build.targets.wheel.sources]
"." = "godview/sovereign"
