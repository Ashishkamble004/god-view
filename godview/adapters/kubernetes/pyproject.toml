[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-adapter-kubernetes"
version = "4.0.0"
description = "God-View v4 Kubernetes Sense Adapter (GKE & kind API server discovery, events, metrics-server, Prometheus scrape, rollout restart)"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
