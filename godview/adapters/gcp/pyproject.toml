[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-adapters-gcp"
version = "4.0.0"
description = "GCP sense adapters, official MCP stdio clients, and tfstate drift engine for God-View v4"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
