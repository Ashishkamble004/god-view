[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-agent-skills"
version = "4.0.0"
description = "Procedural SKILL.md vault and GCS sync loader"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "godview-invariants",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["../.."]
