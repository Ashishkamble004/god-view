[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-ledger"
version = "4.0.0"
description = "BigQuery Business Event Ledger DDL, OTel Storage Write API exporter, KPI change-points, and process mining"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["../.."]
