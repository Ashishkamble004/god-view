[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-invariants"
version = "4.0.0"
description = "INVARIANT.md & SKILL.md loader, validator, lifecycle manager, and SentinelDefinition compiler"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "sqlglot>=25.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["../.."]
