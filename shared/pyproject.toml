[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godview-shared"
version = "4.0.0"
description = "Shared contracts, capability registry, adapter ABC, OTel helpers, and hermetic fakes for God-View v4"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "import-linter>=2.0",
    "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["godview_shared"]
