[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-insurance-svc"
version = "4.0.0"
description = "Cymbal Auto Finance Utility 4 — Motor Insurance & FastTag Add-On Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    "godview-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["motor_insurance", "app"]
