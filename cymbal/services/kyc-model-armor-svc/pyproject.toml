[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyc-model-armor-svc"
version = "4.0.0"
description = "Cymbal Auto Finance Utility 1 — Digital KYC & Model Armor Text Guardrail (GKE Autopilot)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
    "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
