[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-customer-simulator"
version = "4.0.0"
description = "Cymbal Auto Finance AI Customer Stream Simulator — realistic Indian borrower personas and watermarked specimen KYC cards"
requires-python = ">=3.13"
dependencies = [
    "godview-shared",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
