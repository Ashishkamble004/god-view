[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-banking-cibil-vm"
version = "4.0.0"
description = "Cymbal Auto Finance Utility 5 — Credit Bureau (CIBIL) & Core Banking Settlement (CBS) VM Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    "godview-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cibil_cbs", "app"]
