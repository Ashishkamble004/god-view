steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--network=cloudbuild'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/god-view-containers/${_SERVICE}:${_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/god-view-containers/${_SERVICE}:latest'
      - '${_CONTEXT}'
images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/god-view-containers/${_SERVICE}:${_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/god-view-containers/${_SERVICE}:latest'
substitutions:
  _SERVICE: 'customer-loan-portal-web'
  _SHA: 'latest'
  _DOCKERFILE: 'cymbal/frontends/customer-loan-portal-web/Dockerfile'
  _CONTEXT: 'cymbal/frontends/customer-loan-portal-web'
options:
  logging: CLOUD_LOGGING_ONLY
